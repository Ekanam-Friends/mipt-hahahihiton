<text x="60" y="582" class="body">Демо-профили</text>
<text x="60" y="606" class="body">Хеши токенов сессий</text>
<rect x="330" y="520" width="565" height="110" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="350" y="553" class="label">Результат в интерфейсе</text>
<text x="350" y="582" class="body">Краткий ответ, порядок действий и доказательства</text>
<text x="350" y="606" class="body">Уточнение / частичный ответ / отказ / ошибка</text>
<rect x="940" y="520" width="220" height="110" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="960" y="553" class="label">Контроль качества</text>
