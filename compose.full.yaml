# Complete local service, without a public domain or an existing edge network.
services:
  model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:c7d58273d753d33a352e5c41ab300c5ae040a16fa4b202231bb606478065c124
    command: ["-m", "/models/qwen3-4b-instruct-2507-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8087", "--alias", "regnav-local", "-c", "12288", "-t", "3", "-ngl", "0", "--parallel", "1", "-b", "128", "-ub", "64", "-ctk", "q4_0", "-ctv", "q4_0", "-fa", "on"]
    volumes: ["${REGNAV_MODELS_DIR:-./models}:/models:ro"]
    networks: [model]
    mem_limit: 4g
    cpus: 3.0
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8087/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
  web:
    build: .
    image: mipt-regnav:full
    ports: ["127.0.0.1:${REGNAV_PORT:-8000}:8000"]
    environment:
      REGNAV_LLM: openai
      OPENAI_BASE_URL: http://model:8087/v1
      OPENAI_API_KEY: EMPTY
      OPENAI_MODEL: regnav-local
      REGNAV_LLM_TIMEOUT: "1800"
      REGNAV_WEB_TIMEOUT: "1800"
      REGNAV_LOCAL_ONLY: "1"
      REGNAV_LOCAL_MODEL_HOSTS: model
      REGNAV_WEB_DB: /app/state/accounts.sqlite3
    volumes:
      - ./data/official:/app/data/official:ro
      - full-state:/app/state
    depends_on:
      model: {condition: service_healthy}
    networks: [model, local]
    mem_limit: 768m
    cpus: 0.75
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  model: {internal: true}
  local: {}
volumes:
  full-state: {}
